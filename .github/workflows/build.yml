name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # v0.1.0 のようなタグを push すると Release を作成
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # Release 作成に必要

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ModernShell.csproj)
            echo "version=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # 標準: フォルダー版（ランタイム込み、DLL をそのまま置く）を zip にする。
      # 単一 exe は中の DLL をメモリへ写して使うため、常駐時の使用メモリが倍以上になる（実測 154 MB → 72 MB）
      - name: Publish (folder)
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o "dist/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"

      - name: Zip
        shell: pwsh
        run: |
          $name = "ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}
          path: dist/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}/

      # 持ち運び用: 1 ファイルで動く単一 exe（メモリは多め）。圧縮すると起動時に展開する分さらに増えるので圧縮しない
      - name: Publish (single exe)
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Rename
        shell: bash
        run: mv publish/ModernShell.exe "publish/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}-single.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}-single
          path: publish/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            publish/*.exe
          generate_release_notes: true
