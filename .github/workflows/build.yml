name: build

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']  # v1.0.0 / 1.0.0 のようなタグを push すると、そのリリースにファイルを添付
  release:
    types: [published]      # GitHub の画面でリリースを公開したとき（タグを画面で作った場合も）
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ファイルを添付するリリースのタグ（例: v1.0.0）。空ならビルドだけ'
        required: false

permissions:
  contents: write         # Release 作成に必要

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # リリースに添付するタグ: 画面でのリリース公開 > 手動実行の指定 > タグの push
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$tag" ]]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ModernShell.csproj)
            echo "version=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # 標準: フォルダー版（ランタイム込み、DLL をそのまま置く）を zip にする。
      # 単一 exe は中の DLL をメモリへ写して使うため、常駐時の使用メモリが倍以上になる（実測 154 MB → 72 MB）
      - name: Publish (folder)
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o "dist/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"

      - name: Zip
        shell: pwsh
        run: |
          $name = "ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}
          path: dist/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}/

      # 持ち運び用: 1 ファイルで動く単一 exe（メモリは多め）。圧縮すると起動時に展開する分さらに増えるので圧縮しない
      - name: Publish (single exe)
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Rename
        shell: bash
        run: mv publish/ModernShell.exe "publish/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}-single.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}-single
          path: publish/*.exe

      # リリースにファイルを添付する（リリースが無ければ作る。リリースノートは画面で書いたものをそのまま残す）
      - name: Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.zip
            publish/*.exe
