name: build

on:
  push:
    branches: [main]
    tags: ['v*']          # v0.1.0 のようなタグを push すると Release を作成
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # Release 作成に必要

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ModernShell.csproj)
            echo "version=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # ランタイム込みの単一 exe（.NET のインストール不要）
      # 圧縮はしない: 圧縮すると起動時に .NET 本体や WPF の DLL をメモリ上に展開するため、使用メモリが増える（2 プロセス分）
      - name: Publish
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Rename
        shell: bash
        run: mv publish/ModernShell.exe "publish/ModernShell-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}
          path: publish/*.exe

      # 比較用: 単一 exe にしないフォルダー版（DLL をそのまま置く）。単一 exe は DLL を exe の中から
      # メモリへ写して使うため、フォルダー版のほうが使用メモリが少なくなることがある
      - name: Publish (folder)
        shell: bash
        run: >
          dotnet publish ModernShell.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-folder

      - uses: actions/upload-artifact@v7
        with:
          name: ModernShell-${{ matrix.rid }}-folder
          path: publish-folder/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.exe
          generate_release_notes: true
